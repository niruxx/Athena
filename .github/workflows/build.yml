name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly, so a broken build surfaces even without a same-day push.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  test:
    # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, the oldest versions
    # Athena supports, so this also checks that it still builds against them.
    name: Test (GTK 4.14 / libadwaita 1.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config gettext appstream desktop-file-utils xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked --workspace
      - name: Portal and tray protocol integration
        run: ATHENA_PRIVATE_BUS_TEST=1 GIO_USE_VFS=local GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- cargo test --locked -p athena portal_consent_cancellation_and_tray_wire_protocol -- --ignored --test-threads=1
      - name: Desktop metadata and translations
        run: |
          appstreamcli validate --no-net data/io.github.niruxx.Athena.metainfo.xml
          desktop-file-validate data/io.github.niruxx.Athena.desktop
          for language in $(cat po/LINGUAS); do msgfmt --check --check-format po/$language.po -o /tmp/athena-$language.mo; done
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

  archlinux:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git base-devel rust gettext gtk4 libadwaita polkit polkit-gnome
      - uses: actions/checkout@v4
      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package
        run: su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && BUILDDIR=/tmp/build PKGDEST=/tmp/output makepkg -f --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: athena-archlinux
          path: /tmp/output/*.pkg.tar.zst

  debian:
    name: Debian (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: bash packaging/debian/build-in-podman.sh
      - uses: actions/upload-artifact@v4
        with:
          name: athena-debian
          path: dist-debian/*.deb

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: bash packaging/fedora/build-in-podman.sh
      - uses: actions/upload-artifact@v4
        with:
          name: athena-fedora
          path: dist-fedora/*.rpm

  appimage:
    name: AppImage (GTK 4, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev librsvg2-dev librsvg2-common gobject-introspection pkg-config gettext file patchelf appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Build relocatable AppImage
        run: bash packaging/appimage/build.sh
      - name: Smoke check AppImage command line
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist-appimage/Athena-*-x86_64.AppImage --help
      - uses: actions/upload-artifact@v4
        with:
          name: athena-appimage
          path: dist-appimage/*
