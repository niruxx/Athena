[package]
name = "athena-core"
description = "Package-manager backends for Athena: pacman, dnf, apt, Flatpak, and Snap, driven through their CLIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
regex.workspace = true
serde_json = "1"
semver = "1"
roxmltree = "0.21"
flate2 = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "2"

tar = "0.4"
rustix = { version = "1", features = ["fs"] }
csv = "1"
