[package]
name = "athena"
description = "A package manager for every Linux source: pacman, dnf, apt, Flatpak, and Snap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
athena-core.workspace = true
async-channel = "2"
# GTK 4.14 / libadwaita 1.5 are the oldest supported (Ubuntu 24.04 LTS).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
